# =============================================================================
# Pre-registered benchmark regimes (P3b decision, approved 2026-10-12).
#
# FROZEN at the commit that introduces this file: the cap (6 h) and the window
# lengths (1 h primary / 24 h stress) MUST NOT change after any scheduler
# result has been seen. Schedulers, metrics and analysis may be ADDED, never
# re-picked post hoc. Human-readable pre-registration: reports/sim/regime_prereg.md
# =============================================================================

version: 1
frozen:
  primary_window_s: 3600          # 1 h
  stress_window_s: 86400          # 24 h
  duration_cap_s: 21600           # 6 h, primary only (filter inside the window, before time-scaling)
  stress_rho: 0.8

primary:
  name: capped-1h
  dataset: alibaba2020
  parquet: data/processed/alibaba2020.parquet
  cluster: cluster_small.yaml
  window_s: 3600
  duration_cap_s: 21600
  rho_sweep: [0.6, 0.8, 0.95, 1.1]   # load sweep runs on PRIMARY only
  rho_default: 0.8
  gpu_type: ignore
  # P6 rollout horizon: n_arrivals binds; max_seconds raised so it cannot bind
  # first (capped-1h inter-arrival ~928 s => 20 arrivals ~5.2 h < 24 h).
  horizon: {n_arrivals: 20, max_seconds: 86400, terminal_penalty: true}

stress:
  name: stress-24h
  dataset: alibaba2020
  parquet: data/processed/alibaba2020.parquet
  cluster: cluster_small.yaml
  window_s: 86400
  duration_cap_s: null            # uncapped: whales retained
  rho: [0.8]
  horizon: {n_arrivals: 20, max_seconds: 3600, terminal_penalty: true}   # PLAN Appendix A base value kept

optional_cell:                    # P3b option B, cheap, reported with its own tag
  name: uncapped-1h
  window_s: 3600
  duration_cap_s: null
  rho: [0.8]

# Paired benchmark seeds: every scheduler runs the SAME seeded workload
# instances. Disjoint from the P3b diagnostic seeds 30001/30002.
#
# AMENDMENT 1 (2026-10-12, BEFORE any scheduler result existed): seeds 31001
# and 31006 drew 1 h windows in the trace's first ~5 days where arrivals are
# ~0/h (0 capped-feasible jobs -> degenerate cells). Rule: a benchmark seed
# whose capped-1h window yields 0 feasible jobs is replaced by seed+500,
# repeatedly, until the window is non-empty; replacements are logged here.
# 31001 -> 31501 (485 jobs), 31006 -> 31506 (361 jobs). Cap, window and rho
# are unchanged. All other seeds unchanged.
benchmark_seeds: [31501, 31002, 31003, 31004, 31005, 31506, 31007, 31008, 31009, 31010]

splits:                           # for P6 labeling / P7 training, defined now
  method: chronological at the WINDOW level, no window overlap
  window_bands:                   # a window belongs to a split by its start as a fraction of trace span
    train: [0.0, 0.6]
    val: [0.6, 0.8]
    test: [0.8, 1.0]
  split_seeds:                    # disjoint from each other and from benchmark seeds
    train: [31101, 31102, 31103, 31104, 31105, 31106, 31107, 31108, 31109, 31110,
            31111, 31112, 31113, 31114, 31115, 31116, 31117, 31118, 31119, 31120,
            31121, 31122, 31123, 31124, 31125, 31126, 31127, 31128, 31129, 31130]
    val:   [31201, 31202, 31203, 31204, 31205, 31206, 31207, 31208, 31209, 31210]
    test:  [31301, 31302, 31303, 31304, 31305, 31306, 31307, 31308, 31309, 31310]
  cross_trace:
    dataset: helios (helios_earth first; other clusters as available)
    rule: apply the same 6 h cap and report it; ALSO report uncapped

p6_labeling:
  tracks: [primary]               # stress-24h is HELD OUT from labeling/DAgger from P6 onward
  rollout_policy: edf             # AMENDMENT 2: fixed once, identical across all caps/regimes;
  #                              # never re-picked per cap or per experiment
  terminal_penalty:               # AMENDMENT 2: form fixed before any label exists
    uses_true_remaining_time: true   # labels are outcomes computed INSIDE the rollout;
    #                                # features never see durations (no-leakage unaffected)
    form: >
      TP = sum over jobs pending at horizon end of priority_i * ((load_i +
      duration_i) / cf_i)  [full remaining work, never started]
      + sum over jobs running at horizon end of priority_i * max(0,
      ((load_i + duration_i) / cf_i) - (H_end - start_i))  [true remaining]
    rationale: unbiased J at horizon end; estimate-based penalties would bias
      labels toward the estimate distribution (MdAPE 45%)
  label_sensitivity_check: >
    In P6, recompute labels on a 10% subsample with the estimate-based terminal
    penalty (runtime_est in place of duration); report hard-label agreement and
    regret rank correlation. If agreement < 80%, both label sets are carried
    through P7 and reported.
  tau_rule:                       # AMENDMENT 3: fixed before any model result
    rule: tau = 0.5 * median(positive regrets) over TRAIN-split states only
    rationale: half the typical non-zero gap; computed once at dataset build,
      frozen for P7 training/calibration; val/test never influence tau.
  j_normalization:                # AMENDMENT 3: exact formulas in
    # src/gde/labeling/objective.py (docstring): C per GPU-hour, V and T
    # (incl. TP) per active job, F in [0,1]; n_active = finished-in-window +
    # pending-at-end + running-at-end; trajectory J uses TP = 0.
    preset: balanced
  state_sampling:                 # AMENDMENT 3
    schedulers: [fifo, priority, sjf, edf, best_fit, easy_backfill]
    stratification: time-in-window tercile x queue-length tercile, per
      (window, scheduler); all states from one window stay in one split
    budget: set after the throughput measurement (experiment_p6.yaml),
      before labeling; fixed for P7
  split_seed_replacement: >
    The Amendment-1 rule (seed+500 until the capped-1h window is non-empty)
    applies to split seeds when they are first sampled in P6; replacements
    logged. The arrival-free trace prefix affects only the train band (see
    reports/p4/report.md eligibility section).

  # AMENDMENT 4 (2026-10-13, after the P7 gate failure and accepted diagnosis,
  # BEFORE relabeling). This is the ONE AND ONLY allowed label revision.
  amendment4_label_revision:
    terminal_penalty_revision:
      applies_to: jobs pending or running at horizon end
      projected_lateness: >
        max(0, horizon_end + remaining_est - deadline_ts) per job, priority-
        weighted, summed, normalized like V (divided by n_active) and ADDED to
        the V term of J. remaining_est uses runtime_est_s ONLY (no actual
        durations): pending jobs (load_s + runtime_est_s); running jobs
        max(0, load_s + runtime_est_s - elapsed). The work-based TP
        (Amendment 2, true remaining) is unchanged.
      rationale: >
        P7 diagnosis: mean V(WAIT) 4.5 vs V(RUN) 9.2 because admitting a job
        starts its deadline clock inside the horizon while deferring pushes
        misses past it; deferring must be charged its projected lateness.
    precondition_gate:
      statement: >
        The greedy-argmin policy from the REVISED labels must beat EDF on
        closed-loop trajectory J over the VALIDATION windows (paired seeds).
      pass: >
        paired bootstrap 95% CI of (J_EDF - J_argmin) excludes 0 on the
        favorable side, OR mean >= 0 (CI reported either way)
      on_fail: stop and report; do NOT train any model
    ablations_report_only:
      horizon_60: >
        label a validation subsample with n_arrivals=60; report label
        composition and argmin-vs-EDF closed loop on 5 validation seeds
      work_conserving: >
        argmin over RUN candidates only (never WAIT while any candidate
        fits); closed loop vs EDF on 5 validation seeds
    single_revision_rule: >
      exactly one label revision allowed (this one); no further objective
      changes after seeing revised results
    headline_seeds: [34001, 34002, 34003, 34004, 34505, 34006, 34507, 34008, 34009, 34010]
    #   fresh 1 h windows, never used anywhere before this amendment; 34005 and
    #   34007 were degenerate (arrival-free prefix) and took the Amendment-1
    #   seed+500 replacement -> 34505 (643 jobs) / 34507 (251 jobs), verified
    #   before this commit
    state_filter: >
      multi-candidate states only (n_feasible >= 2): single-feasible states
      are excluded from the training loss and the offline metric (they are
      not labeled at all; their share is measured and reported in the card)
    budget: >
      9 multi-candidate states per (window, scheduler) -> ~2700 states
      (train ~1620 / val ~540 / test ~540), enabled by the measured
      453.8 rollouts/s (P6 card); tau recomputed per Amendment 3 on the
      revised train labels

p7_gate:
  statement: >
    V1 must BEAT the best heuristic on the primary TEST split and be NO WORSE
    than the best heuristic on the stress track. Both reported.
  best_heuristic:                 # AMENDMENT 2: EDF and SJF tied in P4 (see reports/p4)
    candidates: [edf, sjf]
    rule: >
      "Best heuristic" = BOTH EDF and SJF: on the primary TEST split V1 must
      beat each of them (paired bootstrap 95% CI on mean J, balanced preset).
      On the stress track V1 must be no worse than min-J(EDF, SJF), where the
      EDF-vs-SJF tie is broken by balanced-preset J on the VAL split once P6
      computes J. Reported pairwise.
  metric: mean objective J, balanced preset (PLAN.md 5.1), lower is better
  beat: paired bootstrap 95% CI of (J_V1 - J_best_heuristic) excludes zero on the favorable side
  no_worse: paired bootstrap 95% CI includes zero or favors V1

reporting_rules:
  - every table and plot carries a regime tag (capped-1h / stress-24h / uncapped-1h)
  - 'headline must state: "64% of offered work excluded by the 6 h cap" (measured on the
    smoke window, reports/sim/p3b_regime.md) and "deadlines/SLOs/VRAM are synthetic"'
  - report the training / batch_inference (short-small proxy) / online_inference mix per regime
  - any "scheduler X wins" claim must hold on stress-24h or be explicitly scoped to capped-1h
  - stress-24h is held out for labeling from P6 onward
