[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gde"
version = "0.0.1"
description = "GPU Decision Engine: learned, cost-aware GPU scheduling decisions validated in simulation"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
